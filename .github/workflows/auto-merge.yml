# Merges pull requests the reviewer routine has labeled `merge-ready`, once CI is green, and deletes the branch.
# Why a workflow: both routines run as the same GitHub account that opens the pull requests, and GitHub refuses
# self-approval; the sandbox proxy also refuses branch deletion. The Actions bot is a different actor, so neither
# refusal applies. Design §12.4: merges to main require green checks, never a review approval.
name: auto-merge
on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read # listForRef on the head commit; an explicit permissions block sets everything unlisted to none
  actions: read
concurrency:
  group: auto-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let candidates = [];
            if (context.eventName === "pull_request_target") {
              if (context.payload.label?.name !== "merge-ready") { core.info("label is not merge-ready"); return; }
              candidates = [context.payload.pull_request.number];
            } else {
              const sha = context.payload.workflow_run.head_sha;
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
              candidates = prs.data.filter((p) => p.state === "open").map((p) => p.number);
              if (!candidates.length) { core.info(`no open PR for ${sha}`); return; }
            }
            for (const number of candidates) {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
              if (pr.state !== "open") continue;
              if (!pr.labels.some((l) => l.name === "merge-ready")) { core.info(`#${number}: not merge-ready`); continue; }
              const runs = (await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, per_page: 50 })).data.check_runs
                .filter((c) => c.name === "check");
              if (!runs.length) { core.info(`#${number}: CI has not reported yet`); continue; }
              const latest = runs.sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];
              if (latest.status !== "completed" || latest.conclusion !== "success") { core.info(`#${number}: CI ${latest.status}/${latest.conclusion}`); continue; }
              if (pr.mergeable_state === "dirty") {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body: "auto-merge: this branch conflicts with main. Merge main into it and push; the merge will retry when CI is green." });
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: "merge-ready" }).catch(() => {});
                continue;
              }
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: "squash", commit_title: `${pr.title} (#${number})` });
                core.info(`#${number}: merged`);
              } catch (e) {
                core.warning(`#${number}: merge failed: ${e.message}`);
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body: `auto-merge: merge failed: ${e.message}. Will retry on the next CI completion.` });
                continue;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }).catch((e) => core.info(`branch delete skipped: ${e.message}`));
              // Close the linked issues ourselves (T55). GitHub's implicit body linking merged #67 and #81
              // without closing #66 and #10, which left both tickets labeled `review` — a state the builder's
              // selection rule in docs/ROUTINES.md never looks at, so neither was picked up again. The regex
              // lives in lib/closingIssues.ts, which lib/closingIssues.test.ts keeps identical to this copy;
              // github-script has no checkout, so it cannot import it.
              // Fenced blocks and inline code spans are quoted examples, not links: a body explaining this
              // workflow writes "`Closes: #12`" and must not thereby close #12. Blanked before matching.
              const prose = (pr.body ?? "").replace(/```[\s\S]*?```|`[^`\n]*`/g, " ");
              const closing = [];
              for (const m of prose.matchAll(/(?:^|[^\w/-])(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)/gi)) {
                const n = Number(m[1]);
                if (n > 0 && !closing.includes(n)) closing.push(n);
              }
              if (!closing.length) {
                const msg = `#${number}: merged but the body names no issue to close (expected "Closes #<n>")`;
                if (/^T\d+\b/i.test(pr.title)) core.warning(msg); else core.info(msg);
                continue;
              }
              for (const issue_number of closing) {
                try {
                  const issue = (await github.rest.issues.get({ owner, repo, issue_number })).data;
                  for (const name of ["review", "in-progress"]) {
                    if (issue.labels.some((l) => (l.name ?? l) === name)) {
                      await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(() => {});
                    }
                  }
                  if (issue.state === "open") {
                    await github.rest.issues.update({ owner, repo, issue_number, state: "closed", state_reason: "completed" });
                    core.info(`#${number}: closed #${issue_number}`);
                  } else {
                    core.info(`#${number}: #${issue_number} was already closed`);
                  }
                } catch (e) {
                  core.warning(`#${number}: could not close #${issue_number}: ${e.message}`);
                }
              }
            }
