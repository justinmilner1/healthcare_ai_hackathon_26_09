name: ci
# Design §12.4: typecheck, lint, unit tests, e2e against Postgres in a service container and a dependency
# audit, run on GitHub's runners. The gate for a commit is scripts/agent-check.sh in the sandbox of the routine
# that pushes it (docs/ROUTINES.md); this is the second opinion from a fresh checkout on a different machine,
# and it needs Actions billing on the account to run at all (T75). Triggers:
#
#   - `push` to main: every landed commit, from a routine or a human.
#   - `pull_request`: a branch a human opens a pull request from; the routines do not open them.
#   - `workflow_dispatch`: a run on demand.
#   - `schedule`: the backstop, hourly. The `sweep` job first asks whether main's tip already has a ci run of
#     its own and skips the rest of the hour when it does, so this costs a few seconds unless something
#     actually went unchecked.
#
# `main-state` is what makes a red main visible without a reviewer run finding it by hand: it opens one
# `main-red` issue when the check fails on main, and closes it when main comes back green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

# One run per commit. A new push to a pull request cancels that branch's older run; runs on main queue instead
# of cancelling, so no merge loses its verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Scheduled runs only: a commit that already has a ci run does not need another one. Any ci run for this
  # exact sha counts, whatever started it and whether or not it has finished — a verdict is on its way.
  sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      unchecked: ${{ steps.ask.outputs.unchecked }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          others=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$SHA\") | select(.id != $RUN_ID)] | length")
          echo "ci runs on ${SHA:0:7} other than this one: $others"
          if [ "$others" -gt 0 ]; then
            echo "unchecked=false" >> "$GITHUB_OUTPUT"
            echo "$BRANCH is already checked at ${SHA:0:7}; nothing to do" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "unchecked=true" >> "$GITHUB_OUTPUT"
            echo "no ci run on $BRANCH at ${SHA:0:7}; running the check" >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    needs: [sweep]
    # `sweep` is skipped on every trigger but the schedule, hence always(): skipped means "not a sweep, run".
    # And `!= 'false'` rather than `== 'true'`, so the sweep fails open: if its lookup errors the output is
    # empty, and the one job whose purpose is to notice a check that did not happen must not answer that by
    # quietly not happening either. The cost of being wrong that way is one suite; the other way it is silence.
    if: ${{ always() && (github.event_name != 'schedule' || needs.sweep.outputs.unchecked != 'false') }}
    runs-on: ubuntu-latest
    # Sized against what a runner measured, not a round number (T215).
    #
    # This was 20 minutes, and once Actions started running again on 2026-11-01 every push run was
    # cancelled at 20m24s part-way through `e2e`, before any verdict existed — so §12.4's second opinion
    # never finished. Run 41328771421 (`9d25f75`) is the measurement: a real runner, real checkout, killed
    # with 227 of 342 tests passed and nothing failing. Its stages, from the check's own timings table —
    # install 25s, database 1s, typecheck 18s, lint 10s, unit 1m41s, infra 27s, build 1m23s — reach the
    # suite in 5m30s; the 227 tests then took 14m23s, 3.80s each. The remaining 115 at that rate are
    # 7m20s, which puts a green run at about 28 minutes end to end, plus the restore drill it never
    # reached. A GitHub runner is not faster than the sandbox that measured the same check at 17m22s, so
    # 20 was never going to hold it.
    #
    # 45 leaves about 17 minutes over that projection, which is what the failure path wants: a failed
    # suite re-runs just the tests that failed, serially, once (scripts/agent-check.sh), and a recorded
    # `failure` is as much of a second opinion as a `success` — it is also what lets `main-state` below
    # run at all, since it reads `needs.check.result` and a cancelled job is neither. The asymmetry says
    # which way to err: too small records no verdict on anything, which is this bug, while too large only
    # delays killing a job that has genuinely hung — and GitHub's own default there is 360 minutes.
    #
    # Do not shrink this to make the suite fit. No test gets skipped, quarantined or given a smaller
    # budget to beat a clock (docs/ROUTINES.md, "When the box is the problem"); a check that genuinely
    # needs to be faster is its own ticket, and this budget is only what buys it the time it needs.
    timeout-minutes: 45
    # Postgres, matching docker-compose.yml and production RDS (design §3.2, §12.4). scripts/agent-check.sh takes
    # the server from DATABASE_URL and creates its own sweetspot_e2e database on it.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sweetspot
          POSTGRES_PASSWORD: sweetspot
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sweetspot -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # One command, the same one both routines run: install, dependency audit (npm audit --audit-level=high
      # minus security/audit-exceptions.json, design 10.8 and 12.4), typecheck, lint, unit tests, the /infra
      # check (`cdk synth` plus the stack's unit tests, design 3.6 — no AWS credentials needed), Playwright.
      - run: bash scripts/agent-check.sh
        env:
          CI: "1"
          # Credentials for a throwaway container on the runner; nothing here is a secret.
          DATABASE_URL: postgresql://sweetspot:sweetspot@localhost:5432/postgres?schema=public
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: e2e/screenshots, if-no-files-found: ignore }

  # The state of main, written down where a routine or a human will see it without running anything: one open
  # issue while main is red, closed again by the first green run. Pull request runs are not about main, and a
  # skipped `check` (an hour with nothing new) says nothing either way, so neither reaches this job.
  main-state:
    needs: [check]
    if: ${{ always() && github.ref == 'refs/heads/main' && contains(fromJSON('["success", "failure"]'), needs.check.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "main-red";
            const red = process.env.CHECK_RESULT === "failure";
            const sha = context.sha.slice(0, 7);
            const run = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commit = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/commit/${context.sha}`;

            // First failure in a fresh clone of this repo would have nowhere to hang the issue otherwise.
            await github.rest.issues
              .createLabel({ owner, repo, name: label, color: "b60205", description: "ci is failing on main (opened by .github/workflows/ci.yml)" })
              .catch(() => {});

            const open = (await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label, per_page: 100 }))
              .data.filter((i) => !i.pull_request);

            if (red) {
              const body = [
                `\`ci\` failed on \`main\` at \`${sha}\`.`,
                "",
                `- run: ${run}`,
                `- commit: ${commit}`,
                "",
                "Design §12.4: merges to main require green checks. Reproduce with `bash scripts/agent-check.sh`",
                "on `main`, then fix it forward or revert the merge that broke it. Two branches that each passed",
                "on their own can still break each other, so the cause is often the combination rather than one",
                "pull request (T46, T47).",
                "",
                "This issue closes itself on the first green `ci` run on `main`.",
              ].join("\n");
              if (!open.length) {
                const issue = await github.rest.issues.create({
                  owner, repo,
                  title: `main is red: ci failed on ${sha}`,
                  body,
                  labels: [label, "bug", "area:quality"],
                });
                core.warning(`main is red at ${sha}: opened #${issue.data.number}`);
                return;
              }
              // Already tracking it. One comment per commit, so an hour of re-runs is not an hour of noise.
              const number = open[0].number;
              const said = (await github.rest.issues.listComments({ owner, repo, issue_number: number, per_page: 100 })).data;
              if ([open[0].body, ...said.map((c) => c.body)].some((b) => (b || "").includes(sha))) {
                core.warning(`main is still red at ${sha}: #${number} already says so`);
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              core.warning(`main is still red at ${sha}: commented on #${number}`);
              return;
            }

            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `\`ci\` is green on \`main\` at \`${sha}\` (${run}). Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              core.info(`#${issue.number}: closed, main is green at ${sha}`);
            }
